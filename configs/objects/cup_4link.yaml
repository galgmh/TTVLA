# 四连杆杯子资产（lower / middle / upper / handle 四个热节点，固定关节焊成刚体）。
#
# 资产几何、区域顺序和 link 名称的唯一来源是 assets/cup_4link/manifest.yaml
# （由 scripts/build_cup_4link.py 生成）；本文件只描述“怎么摆放、什么材质”。
manifest: assets/cup_4link/manifest.yaml

# 物体热物性。lower 用“装水杯底”的等效集总材料：保持与陶瓷相同的
# 导热率，只增大体积热容并降低有效发射率。其余杯体 link 使用 ceramic。
material: ceramic
link_materials:
  lower: water_filled
  middle: ceramic
  upper: ceramic
  handle: ceramic
material_properties:
  ceramic: {conductivity: 1.5, density: 2300.0, specific_heat: 900.0, emissivity: 0.008}
  water_filled: {conductivity: 1.5, density: 1000.0, specific_heat: 4180.0, emissivity: 0.002}
  platform: {conductivity: 0.2, density: 700.0, specific_heat: 1200.0, emissivity: 0.0}

# 放置：坐在 60 mm 高的平台上（rest_height_m），槽位相对桌面中心。
# place_object 用 AABB 中心对齐槽位；杯子的 AABB 因手柄偏向 -y，
# 所以杯体轴线会落在槽位 +17.5 mm 处。
place_xy: [-0.08, 0.0]
rest_height_m: 0.06
# 每集姿态抖动：热接触任务要求接触区域内的小范围随机化，
# 位置/朝向扰动由采样器逐集抽取。
xy_jitter_m: 0.004
yaw_jitter_rad: 0.03
color: [0.85, 0.84, 0.80]
