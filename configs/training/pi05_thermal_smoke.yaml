# Thermal-π0.5 冒烟配置：dummy 主干 + 随机数据，几秒钟跑完。
#
# 用途：验证训练循环、分阶段冻结、检查点保存/续训。
#   python -m training.pi05.train --config configs/training/pi05_thermal_smoke.yaml --overwrite
exp_name: thermal_pi05_smoke
seed: 0
dtype: float32
num_train_steps: 4
log_interval: 1
save_interval: 2
checkpoint_dir: /tmp/thermal_pi05_smoke
resume: false
overwrite: true
pytorch_weight_path: null
thermal_stage: 4
device: cpu
wandb:
  enabled: false
  project: thermal-pi05

model:
  paligemma_variant: dummy
  action_expert_variant: dummy
  pi05: true
  action_dim: 32             # π0.5 官方内部动作维度；机器人维度见 data.action_dim
  action_horizon: 8
  max_token_len: 64
  dtype: float32
  thermal:
    enabled: true
    hidden_dim: 32
    thermal_latent_dim: 16
    num_spatial_tokens: 4
    memory_size: 2
    window_size: 4

data:
  kind: fake
  batch_size: 2
  num_workers: 0
  image_keys: [base_0_rgb, left_wrist_0_rgb, right_wrist_0_rgb]
  prompt: "pick the cold block"
  action_dim: 7
  action_horizon: 8
  fake_size: 8

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

lr_schedule:
  warmup_steps: 10
  peak_lr: 1.0e-4
  decay_steps: 100
  decay_lr: 1.0e-5
