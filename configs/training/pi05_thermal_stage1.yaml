# Thermal-π0.5 分阶段训练 · Stage 1：只训练热觉编码器。
#
# 规格 §9：Stage 1 冻结 π0.5 主干，只训练接触编码器、点编码器、空间记忆与
# 策略头，让热觉表示先学会读取触觉历史/表面点。loss 只回传热觉辅助项。
#
# 数据格式见 models/pi05/thermal 与 training/pi05/data.py 的 thermalvla-1.0：
# 一集一个 HDF5，root 指向导出目录。
exp_name: thermal_pi05_stage1
seed: 0
dtype: bfloat16
num_train_steps: 5000
log_interval: 10
save_interval: 1000
checkpoint_dir: checkpoints/pi05_thermal/stage1
resume: false
overwrite: false
pytorch_weight_path: null      # 云端转换好的 PyTorch π0.5 权重目录（含 model.safetensors）
thermal_stage: 1
device: auto
wandb:
  enabled: false
  project: thermal-pi05

model:
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  pi05: true
  action_dim: 7
  action_horizon: 50
  max_token_len: 200
  dtype: bfloat16
  thermal:
    enabled: true
    history_size: 8
    window_size: 25
    signal_dim: 14
    num_surface_points: 64
    hidden_dim: 256
    thermal_latent_dim: 128
    num_spatial_tokens: 8
    strategy_gumbel_tau: 1.0
    min_grasp_score: 0.3
    selection_mode: soft
    loss_weight_contact_temp: 0.2
    loss_weight_contact_valid: 0.1
    loss_weight_field_temp: 0.3
    loss_weight_field_safe: 0.1
    loss_weight_skill: 0.2
    loss_weight_target: 0.3

data:
  kind: hdf5
  root: datasets/thermalvla/pick_cold_can
  batch_size: 8
  num_workers: 4
  image_keys: [base_0_rgb, left_wrist_0_rgb, right_wrist_0_rgb]
  prompt: "perform the thermal manipulation task"
  action_dim: 7
  action_horizon: 50
  normalization: null          # null = 从数据集统计并存进检查点
  fake_size: 128

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

lr_schedule:
  warmup_steps: 500
  peak_lr: 1.0e-4
  decay_steps: 5000
  decay_lr: 1.0e-5
