# Thermal-π0.5 分阶段训练 · Stage 4：全局微调。
#
# 规格 §9：在 Stage 3 的基础上解冻 PaliGemma 最后 4 层语言层一起微调
# （PyTorch π0.5 没有 LoRA 实现，用全量微调代替）。学习率三组：
# thermal 1e-4 / action expert 5e-5 / PaliGemma 1e-5。
exp_name: thermal_pi05_stage4
seed: 0
dtype: bfloat16
num_train_steps: 10000
log_interval: 10
save_interval: 1000
checkpoint_dir: checkpoints/pi05_thermal/stage4
resume: false
overwrite: false
pytorch_weight_path: null
thermal_stage: 4
device: auto
wandb:
  enabled: false
  project: thermal-pi05

model:
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  pi05: true
  action_dim: 7
  action_horizon: 50
  max_token_len: 200
  dtype: bfloat16
  thermal:
    enabled: true

data:
  kind: hdf5
  root: datasets/thermalvla/pick_cold_can
  batch_size: 8
  num_workers: 4
  image_keys: [base_0_rgb, left_wrist_0_rgb, right_wrist_0_rgb]
  prompt: "perform the thermal manipulation task"
  action_dim: 7
  action_horizon: 50
  normalization: null
  fake_size: 128

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

lr_schedule:
  warmup_steps: 500
  peak_lr: 1.0e-4
  decay_steps: 10000
  decay_lr: 1.0e-5
