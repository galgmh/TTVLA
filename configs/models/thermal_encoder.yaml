# 热编码器：因果膨胀卷积 + 两个输出头（温度回归、接触有效性）。
#
# 输入 14 通道：每指 6 通道（T、ΔT、Tdot、Fn、|Fτ|、M）× 2 指，
# 加上夹爪宽度 w 和接触时间 t_contact。区域 ID、接触 link ID、真实 link
# 温度、材料参数、目标力都不允许进入模型输入。
model:
  in_channels: 14
  hidden: 64
  levels: 4          # 膨胀率 1,2,4,8，感受野 31 帧（50 Hz 下 0.62 s）
  kernel: 3
  dropout: 0.1
  out_dim: 128

training:
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 50
  seed: 0
  weights: {temp: 1.0, valid: 0.2}
  output_dir: datasets/thermal_contact_v1/runs
  device: auto
  num_workers: 0

# 数据目录（相对仓库根目录）：每个划分是 root 下的一个子目录，里面每集
# 一个 HDF5。划分清单在 data/manifests/ 里冻结。
data:
  root: datasets/thermal_contact_v1
  train: train
  validation: validation
  test_id: test_id
  test_finger_history: test_finger_history
  test_sensor_shift: test_sensor_shift
  test_mixed_contact: test_mixed_contact
