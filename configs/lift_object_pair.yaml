# TemperatureVLA task: lift one of two hot objects (cylinder + box) from one table.
#
# The multi-object variant of lift_object: both bodies are hot, movable and
# graspable; the scripted expert picks one per episode (uniform draw) and the
# language string names it ("lift the aluminum cylinder" / "... box"). The file
# records every body (obs/object_pose, obs/temperature/objects_grid, per-object
# demo attrs), while the legacy object_* attrs and obs/temperature/object keep
# describing the targeted one (format tempvla-1.2).
#
# One material per output file still holds: thermal properties, per-object size
# and mass are frozen at scene build; pose / yaw / initial temperature vary per
# episode, target varies per episode.
#
# `objects:` supersedes the legacy single `object:` block (which is unused when
# `objects` is present). Everything else is the shipped lift_object stack.

task_id: lift_object_pair
language_template: "lift the {material} {shape}"
materials: [aluminum]

# Thermal properties handed to gs.sensors.TemperatureGrid (properties_dict).
# conductivity W/(m*K), density kg/m^3, specific_heat J/(kg*K), emissivity 0-1.
# emissivity is forced to 0 for every material: the engine's per-voxel
# radiation term is ~1e4x too strong at our voxel sizes (docs §9-R14) and a
# hot object would otherwise reach ambient within seconds. Real emissivities
# for the data card: aluminum 0.10, copper 0.30, abs 0.90, steel 0.30.
material_properties:
  aluminum: {conductivity: 205.0, density: 2700.0, specific_heat: 900.0, emissivity: 0.0}
  copper: {conductivity: 385.0, density: 8960.0, specific_heat: 385.0, emissivity: 0.0}
  abs: {conductivity: 0.20, density: 1040.0, specific_heat: 1400.0, emissivity: 0.0}
  steel: {conductivity: 45.0, density: 7850.0, specific_heat: 470.0, emissivity: 0.0}

robot:
  urdf: urdf/panda_bullet/panda.urdf
  merge_fixed_links: false
  hand_link_name: panda_hand
  finger_link_names: [panda_leftfinger, panda_rightfinger]
  ik_link_name: panda_hand
  tcp_offset: [0.0, 0.0, 0.105]   # grip center in the hand frame (see gate1 calibration)
  open_finger_pos: 0.04
  closed_finger_pos: 0.0
  base_pos: [0.0, 0.0, 0.0]
  base_quat: [1.0, 0.0, 0.0, 0.0]
  init_qpos: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785, 0.04, 0.04]

controller:
  pos_scale_m: 0.05          # action a[0:3] * pos_scale -> TCP delta (m)
  rot_scale_rad: 0.5         # action a[3:6] * rot_scale -> TCP rotvec delta
  control_hz: 20.0
  sim_dt: 0.005
  decimation: 10
  ik_damping: 0.1
  ik_max_iters: 25
  ik_max_samples: 4
  # Rate-limit the finger setpoint (m/s of finger-joint travel, 0 = unlimited).
  # 0.04 -> a full 40 mm stroke takes 1 s (docs §9-R22 for the measured effect).
  finger_speed_m_per_s: 0.04

# Scripted-expert knobs. Tuned automatically by `python scripts/autotune.py`
# (which writes a *.tuned.yaml copy); controller scales above are not tuned.
expert:
  approach_clearance_m: 0.08   # approach height above the grasp point
  grasp_z_offset_m: 0.0        # TCP target z relative to the object center
  pos_tol_m: 0.01              # APPROACH -> DESCEND position tolerance
  rot_tol_rad: 0.2             # APPROACH -> DESCEND orientation tolerance
  descend_tol_m: 0.015         # DESCEND -> CLOSE position tolerance
  contact_depth_m: 1.0e-5      # probe depth above which contact counts (unused here: no depth modality)
  squeeze_steps: 10            # closed-loop steps held before lifting
  close_timeout_steps: 40      # give up closing after this many steps
  lift_height_m: 0.10
  lift_tol_m: 0.012            # LIFT -> HOLD position tolerance
  grasp_xy_jitter_m: 0.004     # per-episode grasp xy randomization
  approach_yaw_jitter_rad: 0.15
  close_extra: 1.0             # grip command in CLOSE/LIFT/HOLD (1.0 = closed)

# Both objects sit on the table's +-0.12 m slots (base distance 0.24 m, so the
# min_object_gap_m guard below never fires with these ranges). `box` is grasped
# face-on: the expert snaps the approach yaw to the body's nearest 90 deg
# multiple, hence the small yaw_jitter_rad (a full +-pi would put the fingers on
# an edge about half the time).
objects:
  - shape: cylinder
    place_xy: [0.0, -0.12]
    radius_m: [0.015, 0.025]
    height_m: [0.05, 0.08]
    mass_kg: [0.05, 0.15]
    temp_c: [60.0, 200.0]
    xy_jitter_m: 0.04
    yaw_jitter_rad: 3.14159
  - shape: box
    place_xy: [0.0, 0.12]
    radius_m: [0.012, 0.020]   # half-width: the box is 2r x 2r x h
    height_m: [0.048, 0.065]
    mass_kg: [0.04, 0.12]
    temp_c: [60.0, 200.0]
    xy_jitter_m: 0.04
    yaw_jitter_rad: 0.30
min_object_gap_m: 0.02         # surface separation guard for the sampled slots

tactile:
  # The marker field (`elastomer`) is the tactile representation: one 3D
  # displacement per gel marker, with the undeformed marker positions in
  # layouts/. The grid matches the gsmini/UniVTAC form factor — 9x7 = 63
  # markers/finger — and no rigid probe is sampled. Contact is detected through
  # `contact_links` below (a link-level sensor, not a probe), which is what the
  # expert watches; hdf5 consumers get the same signal as
  # `obs/contact/link_contact` (docs §5.2, §9-R25).
  # Probe density is PER MODALITY, so adding a modality or widening the gel grid
  # does not widen the others. Every object is a tracked indenter link;
  # n_sample_points is a per-link budget (docs §5.3), so the marker density does
  # not depend on object count.
  modalities: [elastomer]
  probe_grid: {default: [4, 3], elastomer: [9, 7]}   # 63 probes/finger
  # Dense height map synthesized from that field (format 1.3): the marker field
  # resampled onto a (H, W) raster spanning the grid's cells, metres, same
  # extent model as the video renderer. Enable per config; the channel is
  # optional in the file (docs §5.2).
  height_map: {enabled: true, size: [64, 64], interpolate: cubic}
  probe_offset_m: 0.0005
  pad_tol_m: 0.0015          # mesh pad-slab thickness (see docs §5.2); 0.5..2 mm stable
  probe_radius_m: 0.004
  proximity_sample_points: 500
  as_grid: true
  # HydroShear length scales (1/m^2). The engine default 700 spreads the
  # response over the whole pad (1/sqrt(700) = 38 mm); 5e4 -> 4.5 mm bulge,
  # 2e4 -> 7 mm shear spread. Keep compressibility at 1: compressibility<1 or
  # elastomer_thickness>0 takes an FFT path that crashes (docs §9-R8).
  # The kernel's physical width scales with the grid spacing (it is applied in
  # FFT cells), so the 9x7 grid gives a ~2.5x wider response and ~5x smaller
  # peak than 16x16 at equal load — accepted, not compensated (docs §9-R25).
  elastomer_params: {lambda_d: 50000.0, lambda_s: 20000.0}
  contact_links: true
  temporal_reduction: median
  world_frame: true          # obs/link_pose makes this exactly invertible per step

temperature:
  finger_grid: [4, 4, 1]
  object_grid: [4, 4, 4]     # per object; obs/temperature/objects_grid stacks them
  ambient_temp_c: 21.0
  # 0 + emissivity 0 = adiabatic episodes: the engine's per-voxel rad/conv term
  # is missing the face-area factor and over-cools ~1e4x at our voxel sizes
  # (docs §9-R14). Contact conduction remains the only thermal channel.
  convection_coefficient: 0.0
  simulate_all_link_temperatures: true
  sensor_time_constant: 0.0
  contact_depth_weight: 0.0  # docs §9-R16 (penetration-area fallback diverges)
  record_ground_truth: true
  finger_properties: {conductivity: 0.02, density: 1100.0, specific_heat: 1400.0, emissivity: 0.0}
  environment_properties: {conductivity: 0.15, density: 700.0, specific_heat: 1600.0, emissivity: 0.0}

table:
  pos: [0.4, 0.0, 0.0]     # xy = table center (z comes from height_m)
  size: [0.6, 0.8, 0.04]
  height_m: 0.4
  # Render-only surface color (RGB 0-1). Omit/null = engine default grey-white
  # (what data/ and data_cam/ were shot with); this warm wood brown is for the
  # demo videos, where a white table blends into the white robot.
  color: [0.55, 0.38, 0.22]

recording:
  output_dir: data_pair
  keep_failed: true
  compression: gzip
  compression_opts: 4
  contact_burst: true
  burst_pre_s: 0.05
  burst_post_s: 0.25
  burst_max_windows: 10
  # Every modality is packed into the 200 Hz windows, including the 16x16 marker
  # field (~218 KiB per window gzipped). Set `burst_modalities: [force, depth]`
  # to drop it — see docs §4.7-L4.

cameras:
  # Same rig as lift_object, but the view must cover both slots (y = +-0.12 m
  # plus jitter): pulled back and centred a little wider than the single-object
  # setup. Verified by looking at a render, not by arithmetic.
  enabled: true
  renderer: raster           # raster | batch (needs a Vulkan loader) | raytrace
  resolution: [256, 256]
  agentview_pos: [0.86, -0.44, 0.78]     # covers y +-0.16 m of object slots
  agentview_lookat: [0.40, 0.0, 0.46]
  fov: 45.0
  eye_in_hand: true
  eye_in_hand_pos: [0.10, 0.0, 0.02]     # hand frame: out to the side of the flange
  eye_in_hand_lookat: [0.0, 0.0, 0.10]   # the TCP, between the fingers
  eye_in_hand_up: [0.0, 0.0, -1.0]       # image-up = world-up with the gripper down
  eye_in_hand_fov: 60.0
  near: 0.01                 # the default 0.1 would clip a wrist camera's fingers
  far: 20.0

max_episode_steps: 400
lift_success_m: 0.05
stable_steps: 10
seed: 0
