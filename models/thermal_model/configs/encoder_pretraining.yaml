# Shared thermal contact encoder pretraining.
#
# Input: 12 channels = two temperatures, two temperature deltas, two rates,
# and two fingertip 3-axis force vectors.
model:
  signal_dim: 12
  hidden_channels: [64, 64, 128, 128]
  dilations: [1, 2, 4, 8]
  kernel_size: 3
  latent_dim: 128
  logvar_min: -4.0
  logvar_max: 3.0

training:
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 50
  seed: 0
  weights: {temp: 1.0, valid: 0.2}
  output_dir: datasets/thermal_encoder/runs
  device: auto
  num_workers: 0

data:
  root: datasets/thermal_encoder
  train: train
  validation: validation
  test: test
