[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermtacvla"
version = "0.1.0"
description = "ThermalContact-v1: single-region thermal contact dataset generation on Genesis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "genesis-world==1.4.1",
    "numpy>=1.26.4",
    "h5py>=3.10",
    "PyYAML>=6.0",
    "scipy>=1.11",   # AABB 旋转、四元数换算
]

[project.optional-dependencies]
# torch 需按 CUDA 版本单独安装（见 README）：
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
dev = ["matplotlib"]

[tool.setuptools.packages.find]
include = ["sim*", "data*", "models*", "training*"]
